<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CUBE TRACK</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --fg: #1b1f2e;
        --muted: #4a5068;
        --primary: #4252d9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12141c;
          --fg: #eceef5;
          --muted: #b4b9cc;
          --primary: #9aa5ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        max-width: 28rem;
        margin: 0 auto 20px;
      }
      button {
        background: var(--primary);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 1rem;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          color: #0b0d14;
        }
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" width="56" height="56" />
      <h1 id="title">Você está offline</h1>
      <p id="text">Reconecte-se à internet para continuar. Suas alterações não se perdem.</p>
      <button type="button" id="retry">Tentar novamente</button>
    </main>
    <script>
      var texts = {
        en: [
          'You are offline',
          'Reconnect to the internet to continue. Your changes are not lost.',
          'Try again',
        ],
        es: [
          'Estás sin conexión',
          'Vuelve a conectarte para continuar. Tus cambios no se pierden.',
          'Intentar de nuevo',
        ],
      };
      var lang = (navigator.language || 'pt-BR').slice(0, 2);
      var entry = texts[lang];
      if (entry) {
        document.documentElement.lang = lang;
        document.getElementById('title').textContent = entry[0];
        document.getElementById('text').textContent = entry[1];
        document.getElementById('retry').textContent = entry[2];
      }
      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
