{{/*
pg_dump diário para armazenamento S3-compatível, usando a imagem dedicada
infra/docker/backup/Dockerfile (postgres:16-alpine + mc) — ver infra/scripts/backup-postgres.sh.
*/}}
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cube-track.fullname" . }}-backup
  labels:
    {{- include "cube-track.labels" . | nindent 4 }}
    {{- include "cube-track.selectorLabels" (dict "component" "backup" "context" $) | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            {{- include "cube-track.selectorLabels" (dict "component" "backup" "context" $) | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          containers:
            - name: backup
              image: {{ .Values.backup.image.registry }}/{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag | default .Chart.AppVersion }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.secretName }}
                      key: DATABASE_URL
                - name: S3_ENDPOINT
                  valueFrom: { configMapKeyRef: { name: {{ include "cube-track.fullname" . }}-config, key: S3_ENDPOINT } }
                - name: S3_REGION
                  valueFrom: { configMapKeyRef: { name: {{ include "cube-track.fullname" . }}-config, key: S3_REGION } }
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3Bucket | default "cubetrack-backups" | quote }}
                - name: S3_FORCE_PATH_STYLE
                  valueFrom: { configMapKeyRef: { name: {{ include "cube-track.fullname" . }}-config, key: S3_FORCE_PATH_STYLE } }
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: {{ .Values.global.secretName }}, key: S3_ACCESS_KEY } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: {{ .Values.global.secretName }}, key: S3_SECRET_KEY } }
                - name: BACKUP_RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
