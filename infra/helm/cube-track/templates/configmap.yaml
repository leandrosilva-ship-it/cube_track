apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cube-track.fullname" . }}-config
  labels:
    {{- include "cube-track.labels" . | nindent 4 }}
data:
  REALTIME_MODE: {{ .Values.global.realtimeMode | quote }}
  PORT: {{ .Values.api.port | quote }}
  METRICS_PORT: {{ .Values.api.metricsPort | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
