{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cube-track.fullname" . }}-worker
  labels:
    {{- include "cube-track.labels" . | nindent 4 }}
    {{- include "cube-track.selectorLabels" (dict "component" "worker" "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "cube-track.selectorLabels" (dict "component" "worker" "context" $) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "cube-track.selectorLabels" (dict "component" "worker" "context" $) | nindent 8 }}
      annotations:
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # BullMQ: jobs em andamento precisam de tempo para terminar (ou devolver ao broker) antes
      # do SIGKILL — ver apps/worker/src/main.ts (SHUTDOWN_TIMEOUT_MS = 30s) e docs/runbooks/.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: {{ include "cube-track.image" (dict "suffix" "worker" "context" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['node', '--enable-source-maps', '--import', './apps/worker/dist/instrumentation.js', 'apps/worker/dist/main.js']
          ports:
            - name: board
              containerPort: {{ .Values.worker.boardPort }}
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          {{- include "cube-track.envFrom" . | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Sem rota /health dedicada: usa o endpoint de métricas (sempre ativo) como sinal de
          # processo vivo. Ver apps/worker/Dockerfile para a mesma observação.
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
